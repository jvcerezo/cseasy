<!doctype html>
<!-- CSEasy icon: A/B/C/D answer bubbles, B filled gold with a check.
     Rendered by pipeline/render_store_graphics.py. The URL hash picks the layer:
       #full  full-bleed icon (Play Store, legacy launcher)
       #fg    adaptive-icon foreground, transparent, mark inside the safe zone
       #bg    adaptive-icon background only -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; }
  .bg { position: absolute; inset: 0;
        background: radial-gradient(120% 90% at 20% 10%, #3b7bea 0%, #1f5fbf 38%, #0e3a8a 75%, #0a2a6a 100%); }
  .glow { position: absolute; width: 900px; height: 900px; left: 62px; top: 62px; border-radius: 50%;
          background: radial-gradient(circle, rgba(255,255,255,.10), rgba(255,255,255,0) 60%); }
  .grid { position: absolute; left: 50%; top: 50%; display: grid; gap: 64px;
          grid-template-columns: repeat(2, 252px); transform: translate(-50%, -50%) scale(var(--s, 1)); }
  .bub { width: 252px; height: 252px; border-radius: 50%; box-sizing: border-box; border: 26px solid #fff;
         display: flex; align-items: center; justify-content: center;
         color: #fff; font-weight: 800; font-size: 130px; line-height: 1; padding-top: 6px; }
  .bub.on { border: none; padding: 0; background: linear-gradient(160deg, #ffd76a, #ffb21f);
            box-shadow: 0 18px 40px rgba(0,0,0,.28), inset 0 -12px 0 rgba(0,0,0,.08); }
  .bub.on svg { width: 156px; height: 156px; }
  body.fg .bg, body.fg .glow { display: none; }
  body.fg .grid { --s: .76; }
  body.bg .grid { display: none; }
</style></head>
<body>
<div class="bg"></div><div class="glow"></div>
<div class="grid">
  <div class="bub">A</div>
  <div class="bub on"><svg viewBox="0 0 24 24"><path d="M4.5 12.5l4.5 4.5L19.5 6.5" fill="none" stroke="#0e3a8a" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="bub">C</div>
  <div class="bub">D</div>
</div>
<script>document.body.className = location.hash.slice(1) || 'full';</script>
</body></html>
