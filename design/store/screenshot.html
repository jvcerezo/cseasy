<!doctype html>
<!-- One Play Store phone screenshot (1080x1920). pipeline/render_store_graphics.py
     fills the double-brace placeholders and renders it with headless Chrome. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: 'Plus Jakarta Sans', sans-serif; position: relative;
         background: radial-gradient(110% 70% at 15% 0%, #3b7bea 0%, #1f5fbf 35%, #0e3a8a 70%, #0a2458 100%); }
  /* Soft bubble shapes echo the icon without competing with the phone. */
  .ring { position: absolute; border-radius: 50%; border: 34px solid rgba(255,255,255,.06); }
  .r1 { width: 520px; height: 520px; right: -170px; top: -120px; }
  .r2 { width: 380px; height: 380px; left: -150px; top: 1180px; }

  header { position: absolute; left: 80px; right: 80px; top: 104px; text-align: center; }
  .eyebrow { display: inline-block; padding: 14px 30px; border-radius: 999px; background: rgba(255,255,255,.12);
             color: #ffd76a; font-weight: 700; font-size: 30px; letter-spacing: 3px; text-transform: uppercase; }
  h1 { margin: 34px 0 0; color: #fff; font-weight: 800; font-size: 78px; line-height: 1.12; letter-spacing: -1.5px;
       text-wrap: balance; }
  h1 em { font-style: normal; color: #ffc53d; }

  .phone { position: absolute; left: 50%; top: 490px; width: 820px; transform: translateX(-50%);
           background: #0b0f1a; border-radius: 96px; padding: 22px; box-sizing: border-box;
           box-shadow: 0 50px 100px rgba(3,12,40,.55), inset 0 0 0 3px #2a3247; }
  .screen { border-radius: 76px; overflow: hidden; background: {{status_bg}}; position: relative; }
  .status { height: 64px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 54px 0 58px; font: 600 28px/1 'Plus Jakarta Sans', sans-serif; color: #1b1f2a; }
  .status .icons { display: flex; gap: 12px; align-items: center; }
  .cam { position: absolute; left: 50%; top: 18px; width: 30px; height: 30px; margin-left: -15px;
         border-radius: 50%; background: #0b0f1a; }
  .screen img { display: block; width: 100%; }
</style></head>
<body>
<div class="ring r1"></div><div class="ring r2"></div>
<header>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{headline}}</h1>
</header>
<div class="phone"><div class="screen">
  <div class="status"><span>9:41</span><span class="icons">
    <svg width="30" height="22" viewBox="0 0 30 22"><path d="M2 20h4V14H2zm7 0h4V10H9zm7 0h4V6h-4zm7 0h4V2h-4z" fill="#1b1f2a"/></svg>
    <svg width="44" height="22" viewBox="0 0 44 22"><rect x="1" y="2" width="36" height="18" rx="5" fill="none" stroke="#1b1f2a" stroke-width="2.5"/><rect x="5" y="6" width="25" height="10" rx="2" fill="#1b1f2a"/><rect x="39" y="8" width="3" height="6" rx="1" fill="#1b1f2a"/></svg>
  </span></div>
  <div class="cam"></div>
  <img src="{{shot}}">
</div></div>
</body></html>
